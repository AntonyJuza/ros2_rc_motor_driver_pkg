cytron_controller_node:
  ros__parameters:
    # GPIO pins for Cytron motor controller
    rc1_pin: 12
    rc2_pin: 13

    # Robot dimensions — matched to URDF (wheel y_reflect * 0.115 * 2)
    wheel_base: 0.23
    wheel_radius: 0.045

    # Motor configuration
    max_speed: 100
    publish_rate: 50.0

    # Encoder parameters
    encoder_pins: [18, 19]
    pulses_per_revolution: 20

    # IMPORTANT: publish_tf = false
    # EKF (robot_localization) owns the odom→base_link TF.
    # Having two nodes broadcast the same TF causes map corruption.
    publish_tf: false
    base_frame: "base_footprint"
    odom_frame: "odom"

diff_drive_controller:
  ros__parameters:
    wheel_base: 0.23        # matched to URDF
    wheel_radius: 0.045     # matched to URDF
    publish_tf: false       # EKF owns odom→base_link TF
    base_frame: "base_footprint"
    odom_frame: "odom"